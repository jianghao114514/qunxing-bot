<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b7bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="128" cy="128" r="96" fill="url(#glow)"/>

  <!-- 虚线轨道环（旋转 15° 增加动感） -->
  <g transform="rotate(15 128 128)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"
            stroke-dasharray="10 14" stroke-linecap="round"/>
    <!-- 轨道上的小卫星点 -->
    <circle cx="128" cy="36" r="5" fill="#8b7bff" opacity="0.9"/>
    <circle cx="220" cy="128" r="3.5" fill="#4fc3f7" opacity="0.75"/>
  </g>

  <!-- 中心四角星（✦ 风格） -->
  <g transform="translate(128 132)">
    <path d="M0 -46 C 6 -16, 16 -6, 46 0 C 16 6, 6 16, 0 46 C -6 16, -16 6, -46 0 C -16 -6, -6 -16, 0 -46 Z"
          fill="url(#starGrad)"/>
  </g>
  <!-- 星星高光 -->
  <g transform="translate(128 132)">
    <path d="M0 -46 C 6 -16, 16 -6, 46 0 C 16 6, 6 16, 0 46 C -6 16, -16 6, -46 0 C -16 -6, -6 -16, 0 -46 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <!-- 小点缀星 -->
  <circle cx="74" cy="84" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="186" cy="190" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="196" cy="74" r="2" fill="#4fc3f7" opacity="0.9"/>
</svg>
